<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy National Girlfriend Day</title>
  
  <!-- Import Google Fonts: Playfair Display (Serif) & Poppins (Sans-Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- Import GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    /* ==========================================================================
       CSS STYLES
       ========================================================================== */
    :root {
      --bg-color: #1a1a24;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #2d2d3a;
      --text-muted: #6b6b7b;
      --accent-color: #e0a96d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      overflow: hidden; /* Prevent scrolling during animation */
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* INITIAL STATE: Gift Box & Hint */
    #initial-view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 50;
      text-align: center;
    }

    .gift-icon {
      font-size: 5rem;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 20px rgba(224, 169, 109, 0.4));
      transition: transform 0.3s ease;
    }

    #initial-view:hover .gift-icon {
      transform: scale(1.1) rotate(5deg);
    }

    .surprise-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      color: var(--accent-color);
    }

    .tap-hint {
      font-size: 0.9rem;
      font-weight: 300;
      letter-spacing: 3px;
      opacity: 0.7;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    /* FLOWER PARTICLES CONTAINER */
    #flower-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .flower-particle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60px; /* Base size */
      height: 60px;
      margin-top: -30px;
      margin-left: -30px;
      opacity: 0;
      will-change: transform, opacity;
      user-select: none;
    }

    /* GREETING CARD */
    #greeting-card {
      position: relative;
      z-index: 100;
      background: var(--card-bg);
      padding: 3rem 2.5rem;
      border-radius: 24px;
      max-width: 90%;
      width: 480px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      
      /* Hidden initially for GSAP to animate */
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
    }

    .card-subtitle {
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    .card-message {
      font-family: 'Poppins', sans-serif;
      font-size: 1.05rem;
      color: var(--text-main);
      line-height: 1.7;
      font-weight: 300;
    }

    /* Responsive scaling for mobile */
    @media (max-width: 480px) {
      .card-title { font-size: 1.8rem; }
      .gift-icon { font-size: 4rem; }
      .flower-particle { width: 45px; height: 45px; margin-top: -22px; margin-left: -22px; }
    }
  </style>
</head>
<body>

  <!-- ==========================================
       1. INITIAL VIEW (GIFT BOX)
       ========================================== -->
  <div id="initial-view">
    <!-- GANTI IKON/GAMBAR KADO DI SINI -->
    <div class="gift-icon">🎁</div> 
    
    <!-- GANTI TEKS AWAL DI SINI -->
    <h2 class="surprise-title">HAPPY NATIONAL GIRLFRIEND DAY</h2>
    <p class="tap-hint">TAP ANYWHERE</p>
  </div>

  <!-- ==========================================
       2. FLOWER CONTAINER (For GSAP Burst)
       ========================================== -->
  <div id="flower-container"></div>

  <!-- ==========================================
       3. GREETING CARD (Final State)
       ========================================== -->
  <div id="greeting-card">
    <!-- GANTI NAMA PANGGILAN DI SINI -->
    <p class="card-subtitle">Happy National Girlfriend Day, [Nama Panggilan]</p>
    
    <!-- GANTI NAMA PASANGAN DI SINI -->
    <h1 class="card-title">To The Prettiest Girl, <br>[Nama Pasangan]</h1>
    
    <!-- GANTI PESAN ROMANTIS DI SINI -->
    <p class="card-message">
      I hope today brings you as much joy as you give to everyone around you.
    </p>
  </div>

  <!-- ==========================================
       JAVASCRIPT LOGIC & GSAP ANIMATIONS
       ========================================== -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      const initialView = document.getElementById("initial-view");
      const flowerContainer = document.getElementById("flower-container");
      const greetingCard = document.getElementById("greeting-card");
      let isAnimating = false;

      // ==========================================
      // PENGATURAN BUNGA (FLOWER ASSETS)
      // ==========================================
      // Menggunakan emoji untuk memastikan langsung tampil tanpa error loading gambar.
      // Anda bisa menggantinya kembali dengan tag <img> atau background-image jika punya aset PNG lokal.
      const flowerEmojis = ["🌻", "🌹", "🌸", "🌼"];

      const TOTAL_FLOWERS = 150; // Ditingkatkan drastis agar menutupi layar

      // 1. Buat elemen bunga terlebih dahulu (Preparation)
      for (let i = 0; i < TOTAL_FLOWERS; i++) {
        const flower = document.createElement("div");
        flower.classList.add("flower-particle");
        
        // Pilih emoji acak
        const randomEmoji = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
        flower.textContent = randomEmoji;
        flower.style.fontSize = (Math.random() * 30 + 40) + "px"; // Ukuran font acak besar (40px - 70px)
        flower.style.display = "flex";
        flower.style.justifyContent = "center";
        flower.style.alignItems = "center";
        
        flowerContainer.appendChild(flower);
      }

      // 2. Fungsi Eksekusi Animasi GSAP (Flower Burst)
      const triggerSurprise = () => {
        if (isAnimating) return;
        isAnimating = true;

        const tl = gsap.timeline();

        // A. Fade out initial view
        tl.to(initialView, {
          opacity: 0,
          scale: 0.8,
          duration: 0.5,
          ease: "power2.inOut",
          onComplete: () => {
            initialView.style.display = "none";
          }
        });

        // B. Flower Burst Animation
        const flowers = document.querySelectorAll(".flower-particle");
        
        // Kita hitung arah acak untuk setiap bunga
        flowers.forEach((flower) => {
          // Jarak penyebaran (mencapai sudut-sudut layar)
          const angle = Math.random() * Math.PI * 2;
          const maxDistance = Math.max(window.innerWidth, window.innerHeight) * 0.8; 
          const distance = Math.random() * maxDistance + 150; 
          
          const endX = Math.cos(angle) * distance;
          const endY = Math.sin(angle) * distance;
          const randomRotation = Math.random() * 360 + 180; // Berputar 180-540 derajat
          const randomScale = Math.random() * 1.5 + 0.8; // Skala bunga lebih besar
          const duration = Math.random() * 1.5 + 1.2;

          // Animasi per bunga
          tl.to(flower, {
            x: endX,
            y: endY,
            rotation: randomRotation,
            scale: randomScale,
            opacity: 1,
            duration: duration,
            ease: "expo.out"
          }, "<0.01"); // Stagger sangat rapat agar terkesan meledak bersamaan
          
          // Setelah sampai di tujuan, buat bunga pelan-pelan melayang jatuh/menghilang
          gsap.to(flower, {
            y: endY + (Math.random() * 300 + 200),
            opacity: 0,
            rotation: randomRotation + 90,
            duration: Math.random() * 2.5 + 2.5,
            ease: "power1.inOut",
            delay: duration + 0.3 // Tunggu sampai burst selesai
          });
        });

        // C. Fade In Greeting Card
        tl.to(greetingCard, {
          opacity: 1,
          scale: 1,
          duration: 1.2,
          ease: "elastic.out(1, 0.6)",
          onStart: () => {
            greetingCard.style.pointerEvents = "auto";
          }
        }, "-=1.5"); // Mulai muncul sebelum bunga selesai menyebar semua
      };

      // Trigger animasi saat layar di-klik
      initialView.addEventListener("click", triggerSurprise);
    });
  </script>
</body>
</html>
